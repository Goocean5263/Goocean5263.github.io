<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#1a1423" />
    <title>第五人格 · 抽数字</title>
    <style>
      :root {
        --bg: #1a1423;
        --bg2: #2a1f3d;
        --gold: #d4af37;
        --gold-light: #f0d878;
        --text: #e8e0f0;
        --card: rgba(42, 31, 61, 0.85);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        background: radial-gradient(
          ellipse at top,
          #2a1f3d 0%,
          #1a1423 60%,
          #0d0817 100%
        );
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .container {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px 14px 40px;
      }

      header {
        text-align: center;
        padding: 18px 0 14px;
      }

      header h1 {
        font-size: 26px;
        font-weight: 700;
        color: var(--gold);
        letter-spacing: 4px;
        text-shadow: 0 0 14px rgba(212, 175, 55, 0.5);
      }

      header p {
        margin-top: 6px;
        font-size: 13px;
        color: #a99bbd;
        letter-spacing: 1px;
      }

      .wheel-card {
        background: var(--card);
        border: 1px solid rgba(212, 175, 55, 0.25);
        border-radius: 16px;
        padding: 18px 16px 22px;
        margin-bottom: 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }

      .card-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .card-title .name {
        font-size: 16px;
        font-weight: 600;
        color: var(--gold-light);
      }

      .card-title .label {
        font-size: 12px;
        color: #a99bbd;
      }

      /* 下拉框 */
      .selector {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        margin-bottom: 14px;
        font-size: 14px;
        color: #c9bbe0;
      }

      .selector select {
        background: #3a2c52;
        color: var(--gold-light);
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 15px;
        font-weight: 700;
        outline: none;
        cursor: pointer;
      }

      .wheel-wrap {
        position: relative;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
        aspect-ratio: 1 / 1;
      }

      /* 指针 */
      .pointer {
        position: absolute;
        top: -4px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 24px solid var(--gold);
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
        z-index: 5;
      }

      .pointer::after {
        content: "";
        position: absolute;
        top: -28px;
        left: -8px;
        width: 16px;
        height: 16px;
        background: var(--gold);
        border-radius: 50%;
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .spin-btn {
        display: block;
        width: 100%;
        max-width: 320px;
        margin: 18px auto 0;
        padding: 13px 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #1a1423;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(212, 175, 55, 0.35);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }

      .spin-btn:active {
        transform: scale(0.97);
        box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
      }

      .spin-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .result {
        text-align: center;
        margin-top: 14px;
        min-height: 30px;
        font-size: 15px;
        color: #a99bbd;
      }

      .result .num {
        font-size: 22px;
        font-weight: 800;
        color: var(--gold-light);
        margin: 0 4px;
      }

      /* 组合结果 */
      .combo {
        text-align: center;
        margin-top: 6px;
        margin-bottom: 18px;
        padding: 14px;
        background: var(--card);
        border: 1px solid rgba(212, 175, 55, 0.25);
        border-radius: 16px;
      }

      .combo .combo-label {
        font-size: 13px;
        color: #a99bbd;
        letter-spacing: 1px;
      }

      .combo .combo-val {
        font-size: 28px;
        font-weight: 800;
        color: var(--gold);
        margin-top: 6px;
        letter-spacing: 2px;
        text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        min-height: 34px;
      }

      footer {
        text-align: center;
        margin-top: 24px;
        font-size: 12px;
        color: #6d5f85;
        line-height: 1.7;
      }

      @media (max-width: 360px) {
        header h1 {
          font-size: 22px;
          letter-spacing: 3px;
        }
        .spin-btn {
          font-size: 15px;
          padding: 12px 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>第五人格 · 抽数字</h1>
        <p>点击转盘或按钮开始抽取</p>
      </header>

      <!-- 第一个转盘 -->
      <div class="wheel-card">
        <div class="card-title">
          <span class="name">转盘一</span>
          <span class="label" id="w1-label">4 个区域</span>
        </div>

        <div class="selector">
          <label for="seg-select">分区数量：</label>
          <select id="seg-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
          </select>
        </div>

        <div class="wheel-wrap">
          <div class="pointer"></div>
          <canvas id="wheel1"></canvas>
        </div>
        <button class="spin-btn" id="spin1">开 始 抽 取</button>
        <div class="result" id="result1">等待抽取…</div>
      </div>

      <!-- 第二个转盘 -->
      <div class="wheel-card">
        <div class="card-title">
          <span class="name">转盘二</span>
          <span class="label">9 个区域</span>
        </div>

        <div class="wheel-wrap">
          <div class="pointer"></div>
          <canvas id="wheel2"></canvas>
        </div>
        <button class="spin-btn" id="spin2">开 始 抽 取</button>
        <div class="result" id="result2">等待抽取…</div>
      </div>

      <!-- 组合结果 -->
      <div class="combo">
        <div class="combo-label">组合结果</div>
        <div class="combo-val" id="combo-val">- -</div>
      </div>

      <footer>
        第五人格抽数字小工具<br />
        适配手机端访问
      </footer>
    </div>

    <script>
      (function () {
        // 分区颜色（最多 9 种）
        var COLORS = [
          "#E74C3C",
          "#F39C12",
          "#F1C40F",
          "#2ECC71",
          "#1ABC9C",
          "#3498DB",
          "#9B59B6",
          "#E91E63",
          "#34495E",
        ];

        var TEXT_DARK = ["#1a1423", "#1a1423", "#1a1423", "#ffffff"];
        function textColorFor(i) {
          return TEXT_DARK[i % TEXT_DARK.length];
        }

        // 通用转盘类
        function Wheel(canvasId, segmentCount) {
          this.canvas = document.getElementById(canvasId);
          this.ctx = this.canvas.getContext("2d");
          this.segmentCount = segmentCount;
          this.rotation = 0; // 当前角度（弧度）
          this.spinning = false;
          this.resize();
          this.draw();

          var self = this;
          window.addEventListener("resize", function () {
            self.resize();
            self.draw();
          });
        }

        Wheel.prototype.resize = function () {
          var dpr = window.devicePixelRatio || 1;
          var rect = this.canvas.getBoundingClientRect();
          var size = Math.max(rect.width, 1);
          this.canvas.width = size * dpr;
          this.canvas.height = size * dpr;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          this.size = size;
        };

        Wheel.prototype.setSegments = function (n) {
          this.segmentCount = n;
          this.rotation = 0;
          this.draw();
        };

        Wheel.prototype.draw = function () {
          var ctx = this.ctx;
          var size = this.size;
          var cx = size / 2;
          var cy = size / 2;
          var radius = Math.max(size / 2 - 6, 1);

          ctx.clearRect(0, 0, size, size);

          var n = this.segmentCount;
          var anglePer = (Math.PI * 2) / n;

          for (var i = 0; i < n; i++) {
            // 让第 i 个扇区的中线初始指向顶部指针
            // 扇区 i 的起始角度 = -PI/2 - anglePer/2 + i*anglePer + rotation
            var start =
              -Math.PI / 2 - anglePer / 2 + i * anglePer + this.rotation;
            var end = start + anglePer;

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, start, end);
            ctx.closePath();
            ctx.fillStyle = COLORS[i % COLORS.length];
            ctx.fill();

            // 分隔线
            ctx.strokeStyle = "rgba(26,20,35,0.5)";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 数字
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(start + anglePer / 2);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            var fontSize = Math.max(Math.floor(radius * 0.16), 12);
            ctx.font =
              "bold " +
              fontSize +
              'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.fillStyle = textColorFor(i);
            ctx.fillText(String(i + 1), radius * 0.62, 0);
            ctx.restore();
          }

          // 外圈
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.strokeStyle = "#d4af37";
          ctx.lineWidth = 4;
          ctx.stroke();

          // 中心圆
          ctx.beginPath();
          ctx.arc(cx, cy, radius * 0.12, 0, Math.PI * 2);
          ctx.fillStyle = "#d4af37";
          ctx.fill();
          ctx.strokeStyle = "#1a1423";
          ctx.lineWidth = 2;
          ctx.stroke();
        };

        // 计算指针指向的扇区编号（1-based）
        Wheel.prototype.getResultIndex = function () {
          var n = this.segmentCount;
          var anglePer = (Math.PI * 2) / n;
          // 归一化旋转角度到 [0, 2PI)
          var r =
            ((this.rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          // 指针在顶部（-PI/2 方向）。扇区 i 中线在 -PI/2 + i*anglePer + rotation（相对原点）
          // 指针指向角度 = -PI/2，扇区 i 中线 = -PI/2 + i*anglePer + rotation
          // 差值 = -i*anglePer - rotation => i = -rotation / anglePer (mod n)
          var idx = Math.round(-r / anglePer);
          idx = ((idx % n) + n) % n;
          return idx + 1; // 1-based
        };

        // 旋转动画，targetIdx 可选（指定结果，1-based）
        Wheel.prototype.spin = function (onDone) {
          if (this.spinning) return;
          this.spinning = true;

          var n = this.segmentCount;
          var anglePer = (Math.PI * 2) / n;
          // 随机额外圈数
          var rounds = 5 + Math.random() * 4; // 5~9 圈
          // 随机落在某个扇区内的偏移（避免总停正中）
          var jitter = (Math.random() - 0.5) * anglePer * 0.7;
          var targetDelta = rounds * Math.PI * 2 + jitter;

          var startRot = this.rotation;
          var endRot = startRot + targetDelta;
          var duration = 4200; // 毫秒
          var startTime = null;
          var self = this;

          function easeOut(t) {
            return 1 - Math.pow(1 - t, 3);
          }

          function frame(ts) {
            if (startTime === null) startTime = ts;
            var elapsed = ts - startTime;
            var t = Math.min(elapsed / duration, 1);
            var eased = easeOut(t);
            self.rotation = startRot + (endRot - startRot) * eased;
            self.draw();
            if (t < 1) {
              requestAnimationFrame(frame);
            } else {
              self.rotation = endRot;
              self.spinning = false;
              if (onDone) onDone(self.getResultIndex());
            }
          }
          requestAnimationFrame(frame);
        };

        // 初始化两个转盘
        var wheel1 = new Wheel("wheel1", 4);
        var wheel2 = new Wheel("wheel2", 9);

        var res1El = document.getElementById("result1");
        var res2El = document.getElementById("result2");
        var comboEl = document.getElementById("combo-val");
        var w1Label = document.getElementById("w1-label");
        var segSelect = document.getElementById("seg-select");
        var spin1Btn = document.getElementById("spin1");
        var spin2Btn = document.getElementById("spin2");

        var r1 = null,
          r2 = null;

        function updateCombo() {
          if (r1 !== null && r2 !== null) {
            comboEl.textContent = r1 + "  ·  " + r2;
          } else if (r1 !== null) {
            comboEl.textContent = r1 + "  ·  -";
          } else if (r2 !== null) {
            comboEl.textContent = "-  ·  " + r2;
          } else {
            comboEl.textContent = "- -";
          }
        }

        // 第一个转盘：下拉框切换分区数
        segSelect.addEventListener("change", function () {
          var n = parseInt(this.value, 10);
          wheel1.setSegments(n);
          w1Label.textContent = n + " 个区域";
          r1 = null;
          res1El.innerHTML = "等待抽取…";
          updateCombo();
        });

        spin1Btn.addEventListener("click", function () {
          if (wheel1.spinning) return;
          this.disabled = true;
          res1El.innerHTML = "抽取中…";
          wheel1.spin(function (idx) {
            r1 = idx;
            res1El.innerHTML = '抽取结果：<span class="num">' + idx + "</span>";
            updateCombo();
            spin1Btn.disabled = false;
          });
        });

        spin2Btn.addEventListener("click", function () {
          if (wheel2.spinning) return;
          this.disabled = true;
          res2El.innerHTML = "抽取中…";
          wheel2.spin(function (idx) {
            r2 = idx;
            res2El.innerHTML = '抽取结果：<span class="num">' + idx + "</span>";
            updateCombo();
            spin2Btn.disabled = false;
          });
        });

        // 点击转盘也可抽取
        wheel1.canvas.addEventListener("click", function () {
          spin1Btn.click();
        });
        wheel2.canvas.addEventListener("click", function () {
          spin2Btn.click();
        });
      })();
    </script>
  </body>
</html>
